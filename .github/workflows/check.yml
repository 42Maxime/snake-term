name: Check snake
on: [push, pull_request]
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Launch in a terminal and quit
        run: |
          python3 - <<'PY'
          import os, pty, select, subprocess, termios
          master, slave = pty.openpty()
          original = termios.tcgetattr(slave)
          with subprocess.Popen(["./snake"], stdin=slave, stdout=slave, stderr=slave) as game:
              try:
                  screen = b""
                  while b"GitHub @42Maxime" not in screen:
                      assert select.select([master], [], [], 5)[0], "No game screen"
                      screen += os.read(master, 4096)
                  os.write(master, b"wx")
                  status = game.wait(timeout=5)
                  assert status == 0, f"snake exited with status {status}"
                  restored = termios.tcgetattr(slave)
                  for flag in (termios.ICANON, termios.ECHO):
                      assert (restored[3] ^ original[3]) & flag == 0, f"Local flag {flag} changed"
                  for index in (termios.VMIN, termios.VTIME):
                      assert restored[6][index] == original[6][index], f"Control {index} changed"
              finally:
                  if game.poll() is None:
                      game.kill()
          PY
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -std=c99 -Wall -Wextra -Werror snake.c move.c draw.c error.c terminal_win.c -o snake.exe
